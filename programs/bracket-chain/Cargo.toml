[package]
name = "bracket-chain"
version = "0.1.0"
description = "BracketChain on-chain tournament protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bracket_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token"] }
switchboard-on-demand = "0.12.1"
# Keccak for the SlotHashes fallback seed derivation (L-1). `anchor_lang::
# solana_program` does not re-export keccak; pin to the version Cargo already
# unifies via the solana-program 2.3.0 stack.
solana-keccak-hasher = "2.2.1"

[dev-dependencies]
# Build a zeroed `PullFeedAccountData` Pod in unit tests (same bytemuck the
# switchboard crate derives with — Cargo unifies the 1.x version).
bytemuck = "1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
