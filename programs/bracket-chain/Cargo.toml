[package]
name = "bracket-chain"
version = "0.1.0"
description = "BracketChain on-chain tournament protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bracket_chain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token"] }
switchboard-on-demand = "0.12.1"
# On-chain SHA-256 (`sol_sha256` syscall) for the Oracle proposal: hashes the
# feed-reported Steam ID to match `participant.identity_hash`. anchor-lang's
# curated `solana_program` facade does not re-export the `hash` module, so we
# pull the minimal hasher crate directly (pinned to the same 2.3.0 as the
# transitive solana-program — no version split).
solana-sha256-hasher = "2.3.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
