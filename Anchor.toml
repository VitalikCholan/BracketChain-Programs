[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
bracket_chain = "3YpkUKBh8288XN2dCKSwBnEdyc5UozSJ19A1ZCLpUZsZ"

[programs.localnet]
bracket_chain = "3YpkUKBh8288XN2dCKSwBnEdyc5UozSJ19A1ZCLpUZsZ"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` boots solana-test-validator and runs ONLY the validator-dependent
# (e2e) suites in tests/e2e/. The hermetic LiteSVM suites (tests/svm/) run without a
# validator via `yarn test:svm`; Rust units via `yarn test:unit`.
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/e2e/**/*.test.ts\""

[hooks]
