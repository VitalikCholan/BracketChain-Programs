[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
bracket_chain = "3YpkUKBh8288XN2dCKSwBnEdyc5UozSJ19A1ZCLpUZsZ"

[programs.localnet]
bracket_chain = "3YpkUKBh8288XN2dCKSwBnEdyc5UozSJ19A1ZCLpUZsZ"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# `anchor test` boots solana-test-validator, so it runs only the validator-dependent
# (e2e) suites. The 3 LiteSVM suites are hermetic and run via `yarn test:svm` (no validator).
# TODO(test-arch steps 2-5): replace the explicit list with "tests/e2e/**/*.ts" after the
# tests/{svm,e2e,contract} migration (see BracketChainDocs/analyze/2026-06-01-test-architecture.md).
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/bracket-chain.ts tests/capacity-128p-deep.test.ts tests/player-reported.test.ts tests/settle-final-litesvm.test.ts"

[hooks]
